name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: VERSION="${GITHUB_REF_NAME}" ./build.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Generate manifest
        run: python3 scripts/genmanifest.py dist "${GITHUB_REF_NAME}" dist/manifest.json

      - name: Validate manifest
        run: go run ./cmd/barista schema validate manifest dist/manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
